[project]
name = "flocky-room"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime-silicon>=1.16 ; platform_machine == 'arm64'",
    "onnxruntime>=1.16 ; platform_machine != 'arm64'",
    "opencv-python>=4.9",
    "numpy>=1.26,<2",
    "Pillow>=10.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.3", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
